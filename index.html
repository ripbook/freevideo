<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --navy: #1c3160;
            --navy-deep: #0f1f4d;
            --accent: #6d4fe3;
            --accent-soft: #e4e6fb;
            --bg: #f1f5fb;
            --paper: #f7faff;
            --line: #dbe3f0;
            --row-alt: #f1f5fc;
            --text-main: #1e293b;
            --text-muted: #5b6b8a;
            --pill-bg: #fde6ea;
            --pill-text: #e11d48;
            --green: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans Tamil', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }

        /* ---------- Controls (not part of the downloaded image) ---------- */
        .controls {
            max-width: 1100px;
            margin: 0 auto 18px auto;
            display: flex;
            flex-wrap: nowrap;          /* one row on desktop */
            gap: 8px;
            justify-content: space-between;
            align-items: center;
        }
        .controls .group { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; }

        .btn {
            background: var(--navy);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 600;
            font-family: inherit;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
        }
        .btn.small { padding: 10px 11px; font-size: 0.8rem; }
        .btn-split { display: flex; gap: 4px; }
        .btn.close-btn {
            padding: 0; width: 34px; height: 34px; flex: 0 0 34px;
            border-radius: 50%; font-size: 0.85rem; line-height: 1;
        }
        .btn.close-btn:hover { background: var(--danger); color: white; }
        .btn:hover { background: var(--accent); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn.green { background: var(--accent); }
        .btn.green:hover { background: #5a3fd0; }
        .btn.ghost { background: #e2e8f4; color: var(--navy); }
        .btn.ghost:hover { background: #d3dbec; }
        .btn.danger { background: var(--danger); }
        .btn.danger:hover { background: #dc2626; }

        select.month-select {
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid #c9d4e6;
            background: white;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--navy);
            cursor: pointer;
        }

        .loading { text-align: center; padding: 40px; color: var(--text-muted); }

        /* ---------- Report (this is what gets downloaded) ---------- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #f6f9fe;
            border: 1px solid var(--line);
            padding-bottom: 28px;
            overflow: hidden;
        }

        header {
            background: var(--navy);
            padding: 30px 44px 34px 44px;
            color: white;
        }
        .title-wrap { position: relative; display: inline-block; padding-bottom: 10px; }
        header h1 { margin: 0; font-size: 2.1rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
        .title-bar {
            position: absolute; left: 0; bottom: 0;
            width: 90px; height: 4px; border-radius: 2px; background: var(--accent);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            padding: 28px 30px 0 30px;
        }
        .stat-card {
            display: flex; align-items: center; gap: 20px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 22px 24px;
        }
        .stat-icon {
            width: 62px; height: 62px; flex: 0 0 62px;
            border-radius: 50%;
            background: var(--accent-soft);
            color: #5b4de0;
            display: flex; align-items: center; justify-content: center;
        }
        .stat-icon svg { width: 30px; height: 30px; display: block; }
        .stat-label {
            display: block; font-size: 0.88rem; font-weight: 600;
            color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.02em;
        }
        .stat-number { display: block; font-size: 2.6rem; font-weight: 700; color: var(--navy-deep); line-height: 1.1; margin-top: 4px; }

        .table-container { padding: 28px 30px 0 30px; overflow-x: auto; }
        .table-wrap { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: white; min-width: 640px; }
        table { width: 100%; border-collapse: collapse; }

        th {
            background: var(--navy);
            color: white;
            padding: 16px 26px;
            text-align: left;
            text-transform: uppercase;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            border-right: 1px solid rgba(255,255,255,0.12);
        }
        th:last-child { border-right: none; }

        td {
            padding: 12px 26px;
            font-size: 1rem;
            vertical-align: middle;
            border-bottom: 1px solid #e6ecf6;
            border-right: 1px solid #dfe6f2;
            background: white;
        }
        td:last-child { border-right: none; }
        tr.alt td { background: var(--row-alt); }
        tbody tr:last-child td { border-bottom: none; }

        .staff-badge { font-weight: 700; color: var(--accent); }

        .ticket-no {
            font-weight: 700;
            color: var(--pill-text);
            background: var(--pill-bg);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            display: inline-block;
        }

        .status-pill { font-weight: 700; font-size: 0.82rem; padding: 4px 12px; border-radius: 6px; display: inline-block; }
        .status-pill.pending { background: #fff3d6; color: #b45309; }
        .status-pill.done { background: #d9f7ea; color: #047857; }

        .empty-state { color: #8a97b4; font-style: italic; font-size: 0.92rem; text-align: center; }

        .actions { white-space: nowrap; width: 1%; }
        .icon-btn {
            border: none; background: #e9edfb; color: var(--accent);
            border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 0.78rem;
            font-weight: 600; font-family: inherit; margin-right: 4px;
        }
        .icon-btn:hover { background: #dbe1f8; }
        .icon-btn.del { background: #fdecef; color: var(--danger); }
        .icon-btn.del:hover { background: #fbd9df; }

        .error-message {
            background: #fee2e2; color: #991b1b; padding: 15px;
            border-radius: 8px; margin: 20px; text-align: center;
        }

        /* ---------- Modals ---------- */
        .overlay {
            position: fixed; inset: 0; background: rgba(15,31,77,0.5);
            display: none; align-items: center; justify-content: center;
            padding: 20px; z-index: 100;
        }
        .overlay.show { display: flex; }
        .modal {
            background: white; border-radius: 14px; padding: 26px;
            width: 100%; max-width: 440px; box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            max-height: 100%; overflow-y: auto;
        }
        .modal h2 { margin: 0 0 4px 0; font-size: 1.2rem; color: var(--navy); }
        .modal p.sub { margin: 0 0 16px 0; color: var(--text-muted); font-size: 0.85rem; }
        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
        .field input, .field select {
            width: 100%; padding: 11px 12px; border: 1px solid #c9d4e6; border-radius: 8px;
            font-family: inherit; font-size: 0.95rem; background: white; color: var(--text-main);
        }
        .field input:focus, .field select:focus { outline: 2px solid var(--accent); border-color: transparent; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
        .modal-error { color: #991b1b; background: #fee2e2; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; margin-top: 10px; display: none; }
        .inline-row { display: flex; gap: 8px; }
        .inline-row select { flex: 1; }

        /* ---------- Summary dashboard ---------- */
        .summary-result {
            background: var(--accent-soft);
            border-radius: 10px;
            padding: 16px;
            margin-top: 10px;
            text-align: center;
        }
        .summary-label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
        .summary-total { font-size: 2.4rem; font-weight: 700; color: var(--navy-deep); line-height: 1.1; margin-top: 2px; }


        .modal.wide { max-width: 520px; }
        .summary-staff-wrap { max-height: 230px; overflow-y: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; }
        .summary-staff { width: 100%; border-collapse: collapse; }
        .summary-staff th { position: sticky; top: 0; padding: 8px 12px; font-size: 0.7rem; }
        .summary-staff td { padding: 7px 12px; font-size: 0.85rem; }
        .summary-staff th.n, .summary-staff td.n { text-align: center; width: 70px; }
        .summary-staff tr.zero td { color: #9aa7c2; }
        .summary-staff td.nu { font-size: 0.78rem; color: var(--text-muted); }
        .sr-table td.nu { font-size: 0.9rem; color: var(--text-muted); }
        .th-flex { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .x-btn { border: none; background: #fdecef; color: var(--danger); border-radius: 50%; width: 20px; height: 20px; padding: 0; font-size: 0.65rem; line-height: 1; cursor: pointer; flex: 0 0 20px; }
        .x-btn:hover { background: var(--danger); color: white; }

        /* Off-screen report that gets downloaded from the Summary dashboard */
        #summaryReport { position: absolute; left: -10000px; top: 0; width: 760px; background: #f6f9fe; font-family: 'Inter', 'Noto Sans Tamil', sans-serif; color: var(--text-main); }
        .sr-head { background: var(--navy); color: #fff; padding: 26px 30px 28px 30px; }
        .sr-head h3 { margin: 0; font-size: 1.6rem; font-weight: 700; }
        .sr-head p { margin: 8px 0 0 0; font-size: 1rem; opacity: 0.85; }
        .sr-stats { display: grid; grid-template-columns: 260px; gap: 14px; padding: 22px 26px 0 26px; }
        .sr-card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 14px 18px; }
        .sr-card span { display: block; font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
        .sr-card b { display: block; font-size: 2rem; color: var(--navy-deep); line-height: 1.2; margin-top: 2px; }
        .sr-table { padding: 22px 26px 26px 26px; }
        .sr-table .table-wrap { min-width: 0; }
        .sr-table th, .sr-table td { padding-top: 11px; padding-bottom: 11px; }
        .sr-table .num { text-align: center; }
        .sr-table tr.zero td { color: #9aa7c2; }

        @media (max-width: 1000px) {
            .controls, .controls .group { flex-wrap: wrap; }
        }

        @media (max-width: 800px) {
            .stats { grid-template-columns: 1fr; padding: 20px 16px 0 16px; }
            .table-container { padding: 20px 16px 0 16px; }
            header { padding: 22px 20px 26px 20px; }
            header h1 { font-size: 1.5rem; }
            td, th { padding-left: 14px; padding-right: 14px; }
        }
    </style>
</head>
<body>

<div class="controls">
    <div class="group">
        <select class="month-select" id="monthSelect" onchange="onMonthChange()"></select>
        <button class="btn" onclick="loadData()" id="refreshBtn">🔄 Refresh</button>
        <button class="btn green" onclick="openEntryModal()" id="addBtn">➕ Add Entry</button>
        <button class="btn ghost small" onclick="openSummary()" id="summaryBtn">📊 Summary</button>
    </div>
    <div class="group">
        <button class="btn ghost" onclick="createNextMonth()" id="nextMonthBtn">📅 Create Next Month</button>
        <button class="btn ghost" onclick="toggleLock()" id="lockBtn">🔒 Editing locked</button>
        <div class="btn-split">
            <button class="btn small" onclick="downloadImage()" id="downloadBtn">📸 Download</button>
            <button class="btn small" onclick="copyImage()" id="copyBtn">📋 Copy</button>
        </div>
        <button class="btn ghost close-btn" onclick="logout()" id="logoutBtn" title="Logout" aria-label="Logout">✕</button>
    </div>
</div>

<div class="container" id="captureArea">
    <header>
        <div class="title-wrap">
            <h1 id="pageTitle">Free Video</h1>
            <span class="title-bar"></span>
        </div>
    </header>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3.5" fill="currentColor"/><path d="M10 8l6 4-6 4z" fill="#e4e6fb"/></svg>
            </div>
            <div>
                <span class="stat-label">Total Videos</span>
                <span class="stat-number" id="statTotal">—</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.3" fill="currentColor"/><path d="M2.5 19.5c0-3.7 2.9-6.2 6.5-6.2s6.5 2.5 6.5 6.2z" fill="currentColor"/><circle cx="17" cy="9" r="2.6" fill="currentColor" opacity=".75"/><path d="M16.4 13.4c3 .1 5.1 2 5.1 5.1h-4.3c0-1.9-.3-3.5-.8-5.1z" fill="currentColor" opacity=".75"/></svg>
            </div>
            <div>
                <span class="stat-label">Total Staff</span>
                <span class="stat-number" id="statStaff">—</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M6 18L18 6"/></svg>
            </div>
            <div>
                <span class="stat-label">Staff Yet to Use Free Video</span>
                <span class="stat-number" id="statNone">—</span>
            </div>
        </div>
    </div>

    <div class="table-container" id="tableContainer">
        <div class="loading">Loading data from Google Sheets...</div>
    </div>
</div>

<!-- Login screen (Password 1): covers the whole page until unlocked -->
<div class="overlay" id="loginOverlay" style="background:#0f1f4d; z-index:200;">
    <div class="modal">
        <h2>Free Video Tracker</h2>
        <p class="sub">Enter the password to open this page. Asked only once on this computer.</p>
        <div class="field">
            <label>Password</label>
            <input id="loginPass" type="password" autocomplete="off">
        </div>
        <div class="modal-error" id="loginError"></div>
        <div class="modal-actions">
            <button class="btn" id="loginBtn" onclick="doLogin()">Open</button>
        </div>
    </div>
</div>

<!-- Add / Edit modal -->
<div class="overlay" id="entryOverlay">
    <div class="modal">
        <h2 id="entryTitle">Add Entry</h2>
        <p class="sub" id="entryMonthLabel"></p>

        <div class="field">
            <label>Staff Name</label>
            <div class="inline-row">
                <select id="fStaff"></select>
                <button class="btn ghost" type="button" onclick="addStaffPrompt()" style="padding:10px 14px;">+ New</button>
            </div>
        </div>
        <div class="field">
            <label>Ticket ID</label>
            <input id="fTicket" type="text" placeholder="e.g. 10234">
        </div>
        <div class="field">
            <label>Decedent Name</label>
            <input id="fName" type="text">
        </div>
        <div class="field">
            <label>Service Date (Date / Month / Year)</label>
            <div class="inline-row">
                <select id="fDay" aria-label="Day"></select>
                <select id="fMonth" aria-label="Month"></select>
                <select id="fYear" aria-label="Year"></select>
            </div>
        </div>
        <div class="field">
            <label>Status</label>
            <select id="fStatus">
                <option value="Pending">Pending</option>
                <option value="Done">Done</option>
            </select>
        </div>
        <div class="modal-error" id="entryError"></div>
        <div class="modal-actions">
            <button class="btn ghost" onclick="closeModals()">Cancel</button>
            <button class="btn" id="entrySaveBtn" onclick="saveEntry()">Save</button>
        </div>
    </div>
</div>

<!-- Summary dashboard -->
<div class="overlay" id="summaryOverlay">
    <div class="modal wide">
        <h2>Summary</h2>
        <p class="sub">Total free video usage for a period</p>
        <div class="field">
            <label>From</label>
            <div class="inline-row">
                <select id="sStartYear" onchange="runSummary()"></select>
                <select id="sStartMonth" onchange="runSummary()"></select>
            </div>
        </div>
        <div class="field">
            <label>To</label>
            <div class="inline-row">
                <select id="sEndYear" onchange="runSummary()"></select>
                <select id="sEndMonth" onchange="runSummary()"></select>
            </div>
        </div>
        <div class="modal-error" id="summaryError"></div>
        <div class="summary-result">
            <div class="summary-label">Total Free Videos</div>
            <div class="summary-total" id="sumTotal">—</div>
        </div>
        <div class="summary-staff-wrap">
            <table class="summary-staff">
                <thead id="sumHead"></thead>
                <tbody id="sumStaff"></tbody>
            </table>
        </div>
        <div class="modal-actions">
            <div style="margin-right:auto; display:flex; gap:8px;">
                <button class="btn small" id="sumDownloadBtn" onclick="downloadSummary()" disabled>📸 Download</button>
                <button class="btn ghost small" id="sumRestoreBtn" onclick="restoreNotUsed()" style="display:none;">↺ Show Not Used Months</button>
            </div>
            <button class="btn ghost" onclick="closeModals()">Close</button>
        </div>
    </div>
</div>

<!-- Password / confirm modal (unlock / delete / create month / new staff) -->
<div class="overlay" id="passOverlay">
    <div class="modal">
        <h2 id="passTitle">Enter password</h2>
        <p class="sub" id="passSub"></p>
        <div class="field" id="passExtraField" style="display:none;">
            <label id="passExtraLabel"></label>
            <input id="passExtra" type="text">
        </div>
        <div class="field" id="passField">
            <label>Password</label>
            <input id="pPass" type="password" autocomplete="off">
        </div>
        <div class="modal-error" id="passError"></div>
        <div class="modal-actions">
            <button class="btn ghost" onclick="closeModals()">Cancel</button>
            <button class="btn" id="passOkBtn">Confirm</button>
        </div>
    </div>
</div>

<!-- Off-screen staff report (filled by JS, captured by the Summary Download button) -->
<div id="summaryReport" aria-hidden="true"></div>

<script>
    // Your Google Apps Script Web App URL (same URL after you redeploy as "New version")
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_6yoi1pKdrNzjOJhgWHqnMfVruoW4YnKS4cloDy8frc9tt74eexRYWTDTqRXW5bE/exec';

    // Staff who only started later. They are ignored for months before their start month.
    // To add another one: 'Name': 'YYYY-MM'
    const STAFF_START = { 'Kanmani': '2026-05' };
    const staffActive = (name, monthKey) => !STAFF_START[name] || monthKey >= STAFF_START[name];

    let months = [];          // [{key,label}]
    let currentMonth = '';    // 'YYYY-MM'
    let monthData = null;     // last loaded data
    let editingRow = null;    // sheet row number when editing, null when adding
    let passAction = null;    // function(password) for the password-only modal

    const $ = id => document.getElementById(id);

    const MONTH_NAMES_JS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const MONTH_SHORT = MONTH_NAMES_JS.map(n => n.slice(0, 3));

    /* ---------- Date helpers: shown as "10 Nov 2026", stored as YYYY-MM-DD ---------- */

    function formatDate(s) {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s == null ? '' : s));
        if (!m) return String(s == null ? '' : s);
        return parseInt(m[3], 10) + ' ' + MONTH_SHORT[parseInt(m[2], 10) - 1] + ' ' + m[1];
    }

    function initDateSelects() {
        $('fDay').innerHTML = Array.from({ length: 31 }, (_, i) =>
            `<option value="${String(i + 1).padStart(2, '0')}">${i + 1}</option>`).join('');
        $('fMonth').innerHTML = MONTH_SHORT.map((n, i) =>
            `<option value="${String(i + 1).padStart(2, '0')}">${n}</option>`).join('');
        const y = new Date().getFullYear();
        setYearOptions(y - 3, y + 3);
    }

    function setYearOptions(from, to) {
        let html = '';
        for (let y = from; y <= to; y++) html += `<option value="${y}">${y}</option>`;
        $('fYear').innerHTML = html;
    }

    // iso = 'YYYY-MM-DD'
    function setDateFields(iso) {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
        const d = m ? { y: m[1], m: m[2], d: m[3] } : (() => {
            const t = new Date();
            return { y: String(t.getFullYear()), m: String(t.getMonth() + 1).padStart(2, '0'), d: String(t.getDate()).padStart(2, '0') };
        })();
        const yr = parseInt(d.y, 10);
        const cur = new Date().getFullYear();
        setYearOptions(Math.min(cur - 3, yr), Math.max(cur + 3, yr));
        $('fDay').value = d.d;
        $('fMonth').value = d.m;
        $('fYear').value = d.y;
    }

    // Returns 'YYYY-MM-DD', or '' if the date does not exist (e.g. 31 Feb)
    function getDateFields() {
        const y = parseInt($('fYear').value, 10);
        const m = parseInt($('fMonth').value, 10);
        const d = parseInt($('fDay').value, 10);
        const dt = new Date(y, m - 1, d);
        if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return '';
        return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    }

    /* ---------- Two passwords, each asked once per computer ----------
       Password 1 (view)  : needed to open the page
       Password 2 (edit)  : needed to add / edit / delete / create a month  */

    const VIEW_KEY = 'service_tracker_view_pw';
    const EDIT_KEY = 'service_tracker_edit_pw';
    function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
    const getViewPw = () => lsGet(VIEW_KEY);
    const getEditPw = () => lsGet(EDIT_KEY);

    function updateLockUI() {
        const unlocked = !!getEditPw();
        const btn = $('lockBtn');
        btn.textContent = unlocked ? '🔓 Editing unlocked' : '🔒 Editing locked';
        btn.title = unlocked ? 'Click to lock editing on this computer' : 'Click to enter the edit password';
    }

    function toggleLock() {
        if (getEditPw()) { lsDel(EDIT_KEY); updateLockUI(); }
        else openEditUnlock(null);
    }

    function logout() {
        lsDel(VIEW_KEY);
        lsDel(EDIT_KEY);
        location.reload();
    }

    // Runs fn now if editing is unlocked on this computer, otherwise asks for Password 2 first
    function requireAuth(fn) {
        if (getEditPw()) fn();
        else openEditUnlock(fn);
    }

    function openEditUnlock(then) {
        askPassword({
            title: 'Edit password',
            sub: 'Needed to add or edit entries. Asked only once on this computer.',
            okText: 'Unlock editing',
            onOk: async (pw) => {
                await apiPost({ action: 'verifyEdit', editPassword: pw });
                lsSet(EDIT_KEY, pw);
                updateLockUI();
                closeModals();
                if (then) then();
            }
        });
        $('passOkBtn').classList.remove('danger');
    }

    /* ---------- Login screen (Password 1) ---------- */

    function showLogin(msg) {
        $('loginOverlay').classList.add('show');
        $('loginPass').value = '';
        showErr('loginError', msg || '');
        setTimeout(() => $('loginPass').focus(), 50);
    }

    async function doLogin() {
        const pw = $('loginPass').value;
        if (!pw) return showErr('loginError', 'Password is required');
        const btn = $('loginBtn');
        btn.disabled = true;
        showErr('loginError', '');
        try {
            await apiPost({ action: 'verifyView', viewPassword: pw });
            lsSet(VIEW_KEY, pw);
            $('loginOverlay').classList.remove('show');
            await startApp();
        } catch (err) {
            showErr('loginError', err.message);
        } finally {
            btn.disabled = false;
        }
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    /* ---------- API ---------- */

    // Reading data also goes through POST so the password is never put in the URL
    function apiRead(action, extra) {
        return apiPost(Object.assign({ action, viewPassword: getViewPw() }, extra || {}));
    }

    async function apiPost(payload) {
        // text/plain avoids the CORS preflight that Apps Script cannot answer
        const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.error) {
            if (data.error === 'Wrong password' && payload.action !== 'verifyView') {
                lsDel(VIEW_KEY);      // saved view password is no longer valid
                showLogin('The password was changed. Please enter it again.');
            }
            if (data.error === 'Wrong edit password' && payload.action !== 'verifyEdit') {
                lsDel(EDIT_KEY);      // saved edit password is no longer valid
                updateLockUI();
            }
            throw new Error(data.error);
        }
        return data;
    }

    /* ---------- Loading ---------- */

    async function loadMonths(selectKey) {
        const info = await apiRead('months');
        months = info.months || [];
        const sel = $('monthSelect');
        sel.innerHTML = months.map(m => `<option value="${esc(m.key)}">${esc(m.label)}</option>`).join('');

        if (selectKey && months.some(m => m.key === selectKey)) {
            currentMonth = selectKey;
        } else if (!currentMonth || !months.some(m => m.key === currentMonth)) {
            const cur = info.current;
            currentMonth = months.some(m => m.key === cur) ? cur : (months.length ? months[months.length - 1].key : '');
        }
        sel.value = currentMonth;
    }

    function onMonthChange() {
        currentMonth = $('monthSelect').value;
        loadData();
    }

    async function loadData() {
        const container = $('tableContainer');
        const refreshBtn = $('refreshBtn');
        refreshBtn.disabled = true;
        container.innerHTML = '<div class="loading">Loading data from Google Sheets...</div>';

        try {
            if (!months.length) await loadMonths();
            if (!currentMonth) throw new Error('No month sheets found. Run setupYear2026() in Apps Script first.');
            monthData = await apiRead('data', { month: currentMonth });
            renderTable(monthData);
        } catch (error) {
            container.innerHTML = `<div class="error-message">Error loading data: ${esc(error.message)}<br>Please check your Google Apps Script URL and permissions.</div>`;
        } finally {
            refreshBtn.disabled = false;
        }
    }

    /* ---------- Rendering ---------- */

    function renderTable(data) {
        const title = String(data.title || 'Free Video').replace(' - ', ' — ');
        $('pageTitle').textContent = title;
        document.title = title;

        const entries = data.entries || [];
        const mKey = data.month || currentMonth;

        // Group entries by staff, keeping Staff-sheet order; unknown names go last.
        // Staff who had not started yet in this month are skipped (unless they have an entry).
        const groups = new Map();
        (data.staff || []).forEach(n => { if (staffActive(n, mKey)) groups.set(n, []); });
        entries.forEach(e => {
            if (!groups.has(e.staffName)) groups.set(e.staffName, []);
            groups.get(e.staffName).push(e);
        });

        let noFree = 0;
        groups.forEach(list => { if (list.length === 0) noFree++; });

        $('statTotal').textContent = entries.filter(e => e.ticketId).length;
        $('statStaff').textContent = groups.size;
        $('statNone').textContent = noFree;

        let html = `
            <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width:19%">Staff Name</th>
                        <th style="width:17%">Ticket Details</th>
                        <th>Decedent Name</th>
                        <th style="width:15%">Service Date</th>
                        <th style="width:12%">Status</th>
                        <th class="no-capture"></th>
                    </tr>
                </thead>
                <tbody>`;

        let gi = 0;
        groups.forEach((list, staffName) => {
            const alt = gi % 2 === 1 ? ' alt' : '';
            gi++;
            if (list.length === 0) {
                html += `<tr class="staff-row${alt}">
                    <td class="staff-badge">${esc(staffName)}</td>
                    <td colspan="4" class="empty-state">no free video of this month</td>
                    <td class="actions no-capture"></td>
                </tr>`;
            } else {
                list.forEach((e, i) => {
                    const st = e.status === 'Done' ? 'Done' : 'Pending';
                    html += `<tr class="staff-row${alt}">
                        <td class="staff-badge">${i === 0 ? esc(staffName) : ''}</td>
                        <td>${e.ticketId ? `<span class="ticket-no">#${esc(e.ticketId)}</span>` : ''}</td>
                        <td>${esc(e.decedentName)}</td>
                        <td style="white-space:nowrap">${esc(formatDate(e.date))}</td>
                        <td><span class="status-pill ${st === 'Done' ? 'done' : 'pending'}">${st}</span></td>
                        <td class="actions no-capture">
                            <button class="icon-btn" onclick="openEntryModal(${e.row})">Edit</button>
                            <button class="icon-btn del" onclick="deletePrompt(${e.row})">Delete</button>
                        </td>
                    </tr>`;
                });
            }
        });

        html += '</tbody></table></div>';
        $('tableContainer').innerHTML = html;
    }

    /* ---------- Modals ---------- */

    function closeModals() {
        $('entryOverlay').classList.remove('show');
        $('passOverlay').classList.remove('show');
        $('summaryOverlay').classList.remove('show');
    }

    function showErr(id, msg) {
        const el = $(id);
        el.textContent = msg;
        el.style.display = msg ? 'block' : 'none';
    }

    function fillStaffSelect(selected) {
        const names = (monthData && monthData.staff) ? monthData.staff.slice() : [];
        if (selected && !names.includes(selected)) names.push(selected);
        $('fStaff').innerHTML = names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
        if (selected) $('fStaff').value = selected;
    }

    function openEntryModal(row) {
        requireAuth(() => openEntryForm(row));
    }

    function openEntryForm(row) {
        if (!monthData) return;
        editingRow = row || null;
        showErr('entryError', '');

        if (editingRow) {
            const e = monthData.entries.find(x => x.row === editingRow);
            if (!e) return;
            $('entryTitle').textContent = 'Edit Entry';
            fillStaffSelect(e.staffName);
            $('fTicket').value = e.ticketId;
            $('fName').value = e.decedentName;
            setDateFields(e.date);
            $('fStatus').value = e.status === 'Done' ? 'Done' : 'Pending';
        } else {
            $('entryTitle').textContent = 'Add Entry';
            fillStaffSelect();
            $('fTicket').value = '';
            $('fName').value = '';
            setDateFields(new Date().toISOString().slice(0, 10));
            $('fStatus').value = 'Pending';
        }
        const m = months.find(x => x.key === currentMonth);
        $('entryMonthLabel').textContent = m ? m.label : '';
        $('entryOverlay').classList.add('show');
        setTimeout(() => $('fTicket').focus(), 50);
    }

    async function saveEntry() {
        const btn = $('entrySaveBtn');
        const payload = {
            action: editingRow ? 'update' : 'add',
            editPassword: getEditPw(),
            month: currentMonth,
            row: editingRow,
            staffName: $('fStaff').value,
            ticketId: $('fTicket').value.trim(),
            decedentName: $('fName').value.trim(),
            date: getDateFields(),
            status: $('fStatus').value
        };
        if (!payload.editPassword) { closeModals(); return openEditUnlock(() => openEntryForm(editingRow)); }
        if (!payload.staffName) return showErr('entryError', 'Select a staff name');
        if (!payload.ticketId) return showErr('entryError', 'Ticket ID is required');
        if (!payload.date) return showErr('entryError', 'Select a valid service date');

        btn.disabled = true; btn.textContent = 'Saving...';
        showErr('entryError', '');
        try {
            await apiPost(payload);
            closeModals();
            await loadData();
        } catch (err) {
            showErr('entryError', err.message === 'Wrong edit password'
                ? 'The edit password was changed. Close this and enter it again.'
                : err.message);
        } finally {
            btn.disabled = false; btn.textContent = 'Save';
        }
    }

    // Generic password / confirm modal
    function askPassword({ title, sub, extraLabel, extraValue, okText, onOk, hidePassword }) {
        $('passTitle').textContent = title;
        $('passSub').textContent = sub || '';
        $('passField').style.display = hidePassword ? 'none' : 'block';
        $('pPass').value = '';
        showErr('passError', '');
        $('passOkBtn').textContent = okText || 'Confirm';
        $('passOkBtn').disabled = false;

        const extra = $('passExtraField');
        if (extraLabel) {
            extra.style.display = 'block';
            $('passExtraLabel').textContent = extraLabel;
            $('passExtra').value = extraValue || '';
        } else {
            extra.style.display = 'none';
        }

        passAction = onOk;
        $('passOkBtn').onclick = async () => {
            const pw = hidePassword ? getEditPw() : $('pPass').value;
            if (!pw) return showErr('passError', 'Password is required');
            const btn = $('passOkBtn');
            btn.disabled = true;
            showErr('passError', '');
            try {
                await passAction(pw, $('passExtra').value.trim());
            } catch (err) {
                showErr('passError', err.message);
                btn.disabled = false;
            }
        };
        $('passOverlay').classList.add('show');
        setTimeout(() => (extraLabel ? $('passExtra') : $('pPass')).focus(), 50);
        if (hidePassword && !extraLabel) setTimeout(() => $('passOkBtn').focus(), 60);
    }

    function deletePrompt(row) {
        requireAuth(() => deleteConfirm(row));
    }

    function deleteConfirm(row) {
        const e = monthData.entries.find(x => x.row === row);
        askPassword({
            title: 'Delete entry',
            sub: e ? `Delete #${e.ticketId} (${e.decedentName || 'no name'})? This cannot be undone.` : 'Delete this entry?',
            okText: 'Delete',
            hidePassword: true,
            onOk: async (pw) => {
                await apiPost({ action: 'delete', editPassword: pw, month: currentMonth, row });
                closeModals();
                await loadData();
            }
        });
        $('passOkBtn').classList.add('danger');
    }

    function createNextMonth() {
        requireAuth(createNextMonthConfirm);
    }

    function createNextMonthConfirm() {
        const last = months.length ? months[months.length - 1].label : 'the first month';
        askPassword({
            title: 'Create next month',
            sub: `A new sheet will be added after ${last}.`,
            okText: 'Create',
            hidePassword: true,
            onOk: async (pw) => {
                const res = await apiPost({ action: 'createNextMonth', editPassword: pw });
                closeModals();
                await loadMonths(res.month);
                await loadData();
            }
        });
        $('passOkBtn').classList.remove('danger');
    }

    function addStaffPrompt() {
        // Opened on top of the entry modal; the confirm modal sits above it
        askPassword({
            title: 'Add new staff',
            sub: 'The name is saved in the "Staff" sheet.',
            extraLabel: 'Staff Name',
            okText: 'Add Staff',
            hidePassword: true,
            onOk: async (pw, name) => {
                if (!name) throw new Error('Staff name is required');
                await apiPost({ action: 'addStaff', editPassword: pw, staffName: name });
                monthData.staff.push(name);
                $('passOverlay').classList.remove('show');
                fillStaffSelect(name);
            }
        });
        $('passOkBtn').classList.remove('danger');
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeModals();
        if (e.key === 'Enter') {
            if ($('loginOverlay').classList.contains('show')) doLogin();
            else if ($('passOverlay').classList.contains('show')) $('passOkBtn').click();
            else if ($('entryOverlay').classList.contains('show')) saveEntry();
        }
    });

    /* ---------- Summary dashboard ---------- */

    let summaryReq = 0;
    let summaryData = null;
    let hideNotUsed = false;   // true after the x on the "Not Used Months" column is clicked

    function openSummary() {
        if (!months.length) return;
        const years = [...new Set(months.map(m => m.key.slice(0, 4)))];
        const yearOpts = years.map(y => `<option value="${y}">${y}</option>`).join('');
        const monthOpts = MONTH_NAMES_JS.map((n, i) =>
            `<option value="${String(i + 1).padStart(2, '0')}">${n}</option>`).join('');

        ['sStartYear', 'sEndYear'].forEach(id => $(id).innerHTML = yearOpts);
        ['sStartMonth', 'sEndMonth'].forEach(id => $(id).innerHTML = monthOpts);

        // Default: first available month -> currently selected month
        const first = months[0].key;
        const last = currentMonth || months[months.length - 1].key;
        $('sStartYear').value = first.slice(0, 4);
        $('sStartMonth').value = first.slice(5, 7);
        $('sEndYear').value = last.slice(0, 4);
        $('sEndMonth').value = last.slice(5, 7);

        hideNotUsed = false;
        $('summaryOverlay').classList.add('show');
        runSummary();
    }

    // Months of the selected period in which this staff member had no free video.
    // Months before the staff member's start month (see STAFF_START) are not counted.
    function notUsedText(s) {
        const allKeys = (summaryData.months || []).map(m => m.key);
        const elig = allKeys.filter(k => staffActive(s.name, k));
        const multiYear = new Set(allKeys.map(k => k.slice(0, 4))).size > 1;
        const used = new Set(s.usedMonths || []);
        const missed = elig.filter(k => !used.has(k));
        if (!missed.length) return '—';
        if (elig.length > 1 && missed.length === elig.length) return 'All months';
        return missed.map(k => MONTH_SHORT[parseInt(k.slice(5, 7), 10) - 1] + (multiYear ? ' ' + k.slice(0, 4) : '')).join(', ');
    }

    const fmtKey = k => MONTH_NAMES_JS[parseInt(k.slice(5, 7), 10) - 1] + ' ' + k.slice(0, 4);

    function clearSummary() {
        summaryData = null;
        $('sumTotal').textContent = '—';
        $('sumHead').innerHTML = '';
        $('sumStaff').innerHTML = '';
        $('sumDownloadBtn').disabled = true;
        $('sumRestoreBtn').style.display = 'none';
    }

    // Re-draws total, staff table and hidden report from the loaded data
    function refreshSummaryView() {
        if (!summaryData) return;
        const all = summaryData.staff || [];
        // Hide staff who had not started yet in any month of the period (unless they have entries)
        const rows = all.filter(s =>
            s.total > 0 || (summaryData.months || []).some(m => staffActive(s.name, m.key)));
        const total = rows.reduce((sum, s) => sum + s.total, 0);
        const cols = hideNotUsed ? 2 : 3;

        $('sumTotal').textContent = total;

        $('sumHead').innerHTML = `<tr>
            <th>Staff Name</th>
            <th class="n">Total</th>
            ${hideNotUsed ? '' : `<th><div class="th-flex"><span>Not Used Months</span><button class="x-btn" title="Remove this column" onclick="removeNotUsed()">✕</button></div></th>`}
        </tr>`;

        $('sumStaff').innerHTML = rows.length
            ? rows.map(s => `<tr class="${s.total ? '' : 'zero'}">
                    <td>${esc(s.name)}</td>
                    <td class="n"><strong>${s.total}</strong></td>
                    ${hideNotUsed ? '' : `<td class="nu">${esc(notUsedText(s))}</td>`}
                </tr>`).join('')
            : `<tr><td colspan="${cols}" class="empty-state">No staff selected</td></tr>`;

        $('sumRestoreBtn').style.display = hideNotUsed ? '' : 'none';

        buildSummaryReport(rows, total);
        $('sumDownloadBtn').disabled = false;
    }

    function removeNotUsed() {
        hideNotUsed = true;
        refreshSummaryView();
    }

    function restoreNotUsed() {
        hideNotUsed = false;
        refreshSummaryView();
    }

    // Builds the (hidden) report that the Download button turns into an image
    function buildSummaryReport(rows, total) {
        const r = summaryData;
        const period = r.start === r.end ? fmtKey(r.start) : fmtKey(r.start) + ' — ' + fmtKey(r.end);

        const body = rows.map((s, i) => `<tr class="${i % 2 ? 'alt ' : ''}${s.total ? '' : 'zero'}">
                <td class="staff-badge">${esc(s.name)}</td>
                <td class="num"><strong>${s.total}</strong></td>
                ${hideNotUsed ? '' : `<td class="nu">${esc(notUsedText(s))}</td>`}
            </tr>`).join('');

        $('summaryReport').innerHTML = `
            <div class="sr-head"><h3>Free Video — Staff Report</h3><p>${esc(period)}</p></div>
            <div class="sr-stats">
                <div class="sr-card"><span>Total Videos</span><b>${total}</b></div>
            </div>
            <div class="sr-table">
                <div class="table-wrap">
                    <table>
                        <thead><tr>
                            <th>Staff Name</th>
                            <th style="text-align:center;width:${hideNotUsed ? '30%' : '16%'}">Total</th>
                            ${hideNotUsed ? '' : '<th style="width:50%">Not Used Months</th>'}
                        </tr></thead>
                        <tbody>${body}</tbody>
                    </table>
                </div>
            </div>`;
    }

    async function runSummary() {
        const start = $('sStartYear').value + '-' + $('sStartMonth').value;
        const end = $('sEndYear').value + '-' + $('sEndMonth').value;
        showErr('summaryError', '');

        if (start > end) {
            summaryReq++;
            clearSummary();
            return showErr('summaryError', 'Start month must be before or equal to end month');
        }

        const myReq = ++summaryReq;
        clearSummary();
        $('sumTotal').textContent = '...';
        try {
            const r = await apiRead('summary', { start, end });
            if (myReq !== summaryReq) return;     // a newer selection was made
            summaryData = r;
            refreshSummaryView();
        } catch (err) {
            if (myReq !== summaryReq) return;
            clearSummary();
            showErr('summaryError', err.message);
        }
    }

    async function downloadSummary() {
        if (!summaryData) return;
        const btn = $('sumDownloadBtn');
        const oldText = btn.textContent;
        btn.disabled = true;
        btn.textContent = '⏳ ...';
        try {
            if (document.fonts && document.fonts.ready) await document.fonts.ready;
            const canvas = await html2canvas($('summaryReport'), {
                scale: 2,
                backgroundColor: '#f6f9fe',
                windowWidth: 1200,
                onclone: doc => {
                    doc.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');
                    const el = doc.getElementById('summaryReport');
                    el.style.left = '0';
                    el.style.top = '0';
                    el.style.zIndex = '1000';
                }
            });
            const link = document.createElement('a');
            link.download = 'Free-Video-Staff-Report-' + summaryData.start + '_to_' + summaryData.end + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        } catch (err) {
            alert('Could not create the image: ' + err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = oldText;
        }
    }

    /* ---------- Download / Copy as image: header + stat cards + table, no buttons ---------- */

    async function captureCanvas() {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        return html2canvas($('captureArea'), {
            scale: 2,
            backgroundColor: '#f6f9fe',
            windowWidth: 1200,
            onclone: doc => {
                doc.querySelectorAll('.no-capture').forEach(el => el.style.display = 'none');
                const c = doc.getElementById('captureArea');
                c.style.width = '1100px';
                c.style.maxWidth = 'none';
                c.style.border = 'none';
            }
        });
    }

    async function downloadImage() {
        const btn = $('downloadBtn');
        const label = (months.find(m => m.key === currentMonth) || {}).label || 'Month';
        btn.disabled = true;
        const oldText = btn.textContent;
        btn.textContent = '⏳ ...';
        try {
            const canvas = await captureCanvas();
            const link = document.createElement('a');
            link.download = 'Free-Video-' + label.replace(/\s+/g, '-') + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        } catch (err) {
            alert('Could not create the image: ' + err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = oldText;
        }
    }

    async function copyImage() {
        const btn = $('copyBtn');
        if (!navigator.clipboard || !window.ClipboardItem) {
            return alert('Copy is not supported in this browser (it needs https). Use Download instead.');
        }
        btn.disabled = true;
        const oldText = btn.textContent;
        btn.textContent = '⏳ ...';
        try {
            // Passing a promise keeps this working in Safari too
            const blobPromise = captureCanvas().then(c => new Promise(res => c.toBlob(res, 'image/png')));
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blobPromise })]);
            btn.textContent = '✅ Copied';
            setTimeout(() => { btn.textContent = oldText; btn.disabled = false; }, 1500);
        } catch (err) {
            alert('Could not copy the image: ' + err.message);
            btn.textContent = oldText;
            btn.disabled = false;
        }
    }

    // Load on page open
    async function startApp() {
        updateLockUI();
        try {
            await loadMonths();
        } catch (error) {
            $('tableContainer').innerHTML = `<div class="error-message">Error loading data: ${esc(error.message)}<br>Please check your Google Apps Script URL and permissions.</div>`;
            return;
        }
        loadData();
    }

    window.addEventListener('DOMContentLoaded', () => {
        initDateSelects();
        updateLockUI();
        // Password 1 is asked once per computer; the page stays hidden until then
        if (!getViewPw()) showLogin();
        else startApp();
    });
</script>

</body>
